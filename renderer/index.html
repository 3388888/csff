<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>CS:GO Demo Highlights</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">CS:GO<span>Highlights</span></div>
      <div class="side-actions">
        <button id="btnOpenDemos">Open demo(s)…</button>
        <button id="btnOpenFolder" class="ghost">Open folder…</button>
        <button id="btnScanFolder" class="ghost" title="Parse every demo in the folder and rank the best kills across all of them">★ Best of folder</button>
      </div>
      <div id="demoList" class="demo-list"></div>
      <button id="btnSettings" class="ghost settings-btn">⚙ Settings</button>
    </aside>

    <main id="main">
      <div id="empty" class="empty">
        <h1>Load a demo to start</h1>
        <p>Pick a <code>.dem</code> or <code>.dem.bz2</code> — you'll get the scoreboard and a ranked list of cool kills, each with the exact tick and a 2D preview.</p>
      </div>

      <section id="matchView" style="display:none">
        <header id="matchHeader"></header>
        <div class="cols">
          <div class="col-left">
            <h2>Scoreboard</h2>
            <div id="scoreboard"></div>
            <h2 style="margin-top:22px">Round by round <span class="muted" style="font-weight:normal">— kills per round</span></h2>
            <div id="roundView"></div>
          </div>
          <div class="col-right">
            <h2>Cool kills <span id="coolCount" class="muted"></span>
              <button id="btnVdm" class="mini" title="Write a .vdm next to the demo so CS:GO jumps through all these kills">Export highlight VDM</button>
            </h2>
            <div class="cool-filter">
              <input id="coolSearch" type="text" placeholder="filter by player (killer or victim)…" />
              <button id="coolClear" class="mini ghost" title="clear filter">✕</button>
            </div>
            <div id="coolList"></div>
          </div>
        </div>
      </section>

      <div id="status" class="status" style="display:none">
        <div id="statusText"></div>
        <div id="pbar" class="pbar" style="display:none"><div id="pbarFill"></div></div>
      </div>
    </main>
  </div>

  <!-- Preview modal -->
  <div id="previewModal" class="modal" style="display:none">
    <div class="modal-box">
      <div class="modal-head">
        <div id="previewTitle"></div>
        <button id="previewClose" class="x">✕</button>
      </div>
      <div class="preview-stage">
        <canvas id="previewCanvas" width="620" height="620"></canvas>
        <div id="killFeed" class="kill-feed"></div>
      </div>
      <div class="player-controls">
        <button id="playBtn">▶</button>
        <input id="scrub" type="range" min="0" max="100" value="0" />
        <span id="tickLabel" class="muted"></span>
        <label class="solo-toggle"><input id="soloView" type="checkbox" /> solo</label>
        <button id="previewCsgo" class="mini">Open in CS:GO</button>
        <button id="previewReveal" class="mini ghost">Show demo file</button>
      </div>
      <div id="previewMeta" class="preview-meta"></div>
    </div>
  </div>

  <!-- Settings modal -->
  <div id="settingsModal" class="modal" style="display:none">
    <div class="modal-box narrow">
      <div class="modal-head"><div>Settings</div><button id="settingsClose" class="x">✕</button></div>
      <label>csgo.exe path <small>(for “Open in CS:GO”)</small></label>
      <div class="row"><input id="setCsgo" type="text" placeholder="…\ClassicCounter\csgo.exe" /><button id="pickCsgo" class="mini">Browse</button></div>
      <label>HLAE executable <small>(optional)</small></label>
      <div class="row"><input id="setHlae" type="text" placeholder="…\HLAE\hlae.exe" /><button id="pickHlae" class="mini">Browse</button></div>
      <label>Default demos folder</label>
      <div class="row"><input id="setDemos" type="text" /><button id="pickDemosDir" class="mini">Browse</button></div>
      <div class="row2">
        <div><label>Preroll (sec before kill)</label><input id="setPreroll" type="number" step="0.25" min="0" /></div>
        <div><label>Long-range (meters)</label><input id="setLong" type="number" step="1" min="1" /></div>
        <div><label>Multikill gap (sec)</label><input id="setGap" type="number" step="1" min="1" /></div>
        <div><label>Scan threads <small>(parallel)</small></label><input id="setConc" type="number" step="1" min="1" max="32" /></div>
      </div>
      <div class="row2">
        <div><label>Flick min (degrees)</label><input id="setFlick" type="number" step="1" min="1" /></div>
        <div><label>Bhop min speed (u/s)</label><input id="setBhop" type="number" step="5" min="1" /></div>
      </div>
      <div class="row2">
        <div><label>Bhop min jumps</label><input id="setRunJumps" type="number" step="1" min="1" /></div>
        <div><label>Bhop min speed</label><input id="setRunPeak" type="number" step="10" min="250" /></div>
        <div><label>Bhop min air %</label><input id="setRunAir" type="number" step="5" min="0" max="100" /></div>
      </div>
      <div class="row2">
        <div><label>Outnumbered radius</label><input id="setNearby" type="number" step="100" min="100" /></div>
        <div><label>Edgebug min dmg</label><input id="setEdge" type="number" step="5" min="0" /></div>
        <div><label>Max preview (sec)</label><input id="setMaxPrev" type="number" step="5" min="5" /></div>
      </div>
      <label>Show these categories <button id="catAll" class="mini ghost" type="button">all</button> <button id="catNone" class="mini ghost" type="button">none</button></label>
      <div id="catToggles" class="cat-toggles"></div>
      <label style="margin-top:12px">Scoring weights <small>— how many points each thing is worth (higher = ranks higher)</small> <button id="wReset" class="mini ghost" type="button">reset</button></label>
      <div id="weightEditor" class="weight-editor"></div>
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-top:14px">
        <input id="setDelBz2" type="checkbox" style="width:auto" /> Delete the .bz2 after extracting it
      </label>
      <div class="hint">Thresholds re-parse the demo; category toggles apply instantly.</div>
      <div class="modal-foot"><button id="settingsSave">Save</button></div>
    </div>
  </div>

  <script src="weapons.js"></script>
  <script src="app.js"></script>
</body>
</html>
